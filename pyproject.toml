[project]
name = "hubspot-analytics"
version = "0.1.0"
description = "HubSpot -> metrics -> Claude analysis -> verification -> dashboard API"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.setuptools.package-data]
"pipeline.analyze" = ["prompts/*.md"]
"pipeline.publish" = ["static/*"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E731", "B905"]  # zips here pair lists built to equal length

[tool.pytest.ini_options]
testpaths = ["tests"]
